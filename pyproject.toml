[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # 에러·경고·임포트정렬·업그레이드·버그유발패턴
ignore = ["E501"]                    # 한글 주석 특성상 긴 줄 허용

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
